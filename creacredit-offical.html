<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Creacredit | Hivatalos Oldal</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#050c18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #050c18;
      --surface:  #0a1628;
      --card:     #0f1e36;
      --border:   rgba(255,255,255,0.06);
      --gold:     #f5c518;
      --gold-dim: rgba(245,197,24,0.08);
      --text:     #dce8f5;
      --muted:    #3d5270;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .nav-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 100;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropbtn {
      background: linear-gradient(135deg, var(--card), var(--surface));
      color: var(--gold);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      padding: 10px 28px;
      border: 2px solid var(--gold);
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 15px rgba(245, 197, 24, 0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .dropbtn:hover {
      transform: scale(1.08) rotate(-1deg);
      box-shadow: 0 0 25px rgba(245, 197, 24, 0.5);
      background: var(--gold);
      color: var(--bg);
    }
    .dropbtn .arrow {
      transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    .dropdown.active .dropbtn .arrow {
      transform: rotate(225deg) scale(1.2);
    }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 130%;
      left: 50%;
      transform: translateX(-50%) scale(0.7) translateY(-20px);
      background: var(--card);
      min-width: 200px;
      border: 2px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      overflow: hidden;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 1;
    }
    .dropdown.active .dropdown-content {
      display: block;
      opacity: 1;
      transform: translateX(-50%) scale(1) translateY(0);
    }
    .dropdown-content a {
      color: var(--text);
      padding: 14px 20px;
      text-decoration: none;
      display: block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      transition: all 0.3s ease;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .dropdown-content a:last-child { border-bottom: none; }
    .dropdown-content a:hover {
      background: var(--gold);
      color: var(--bg);
      padding-left: 26px;
      letter-spacing: 0.15em;
    }

    .site-header {
      background: linear-gradient(180deg, #09162b 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      padding: 38px 24px 34px;
      text-align: center;
    }
    .site-header .eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .site-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.6rem, 8vw, 5rem);
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1;
    }
    .site-header h1 span { color: var(--gold); }

    .main {
      max-width: 800px;
      margin: 0 auto;
      padding: 42px 16px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(245,197,24,0.05);
      animation: fadeInDown 0.8s ease-out;
    }
    .card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      color: var(--gold);
      letter-spacing: 0.08em;
      margin-bottom: 15px;
    }
    .card p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .btn {
      display: inline-block;
      background: var(--gold);
      color: var(--bg);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      padding: 12px 28px;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(245, 197, 24, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 35px rgba(245, 197, 24, 0.5);
    }

    .btn-secondary {
      background: transparent;
      color: var(--gold);
      border: 2px solid var(--gold);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: var(--gold-dim);
    }

    #custom-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface);
      border: 1px solid var(--gold);
      color: var(--text);
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      font-weight: 600;
      font-size: 0.95rem;
      z-index: 1000;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
      text-align: center;
    }
    #custom-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
  </style>
</head>
<body>

  <div id="custom-toast"></div>

  <!-- Felső lenyíló menü sáv -->
  <nav class="nav-bar">
    <div class="dropdown" id="nav-dropdown">
      <button class="dropbtn" id="dropbtn">Menü <span class="arrow">✦</span></button>
      <div class="dropdown-content">
        <a href="index.html">Index</a>
        <a href="halloffame.html">Hall of Fame</a>
        <a href="insta.html">Instagram</a>
      </div>
    </div>
  </nav>

  <header class="site-header">
    <div class="eyebrow">Hivatalos Elérés</div>
    <h1>CREACREDIT <span>PORTÁL</span></h1>
  </header>

  <main class="main">
    
    <!-- Fő kártya a linkkel és a másolás gombbal -->
    <div class="card">
      <h2>Az Igazi Creacredit</h2>
      <p>Kattints az alábbi gombra, hogy eljuss a hivatalos Creascola pontrendszer oldalra, vagy másold ki a linkjét egyetlen mozdulattal!</p>
      
      <div class="btn-group">
        <a href="https://szuper1212856.github.io/Creascola-point-systen" target="_blank" class="btn">Ugrás az oldalra</a>
        <button class="btn btn-secondary" id="copy-link-btn">Link másolása</button>
      </div>
    </div>

  </main>

  <script>
    const navDropdown = document.getElementById('nav-dropdown');
    const dropBtn = document.getElementById('dropbtn');
    const toast = document.getElementById('custom-toast');
    const copyLinkBtn = document.getElementById('copy-link-btn');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    dropBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      navDropdown.classList.toggle('active');
    });
    window.addEventListener('click', () => {
      navDropdown.classList.remove('active');
    });

    // Link másolás funkció
    copyLinkBtn.addEventListener('click', () => {
      navigator.clipboard.writeText("https://szuper1212856.github.io/Creascola-point-systen");
      showToast("A hivatalos link sikeresen a vágólapra másolva! 📋");
    });
  </script>

</body>
  </html>
