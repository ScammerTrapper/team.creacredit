<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Creacredit — Emlékezés</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#050c18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Creascola" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #050c18;
      --surface:  #0a1628;
      --card:     #0f1e36;
      --border:   rgba(255,255,255,0.06);
      --gold:     #f5c518;
      --gold-dim: rgba(245,197,24,0.08);
      --silver:   #8fa3be;
      --bronze:   #a06a3a;
      --text:     #dce8f5;
      --muted:    #3d5270;
      --green:    #10d97c;
      --red:      #f74040;
      --blue:     #4e8ef7;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .site-header {
      background: linear-gradient(180deg, #09162b 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      padding: 38px 24px 34px;
      text-align: center;
      position: relative;
    }
    .site-header .eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .site-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.6rem, 8vw, 5rem);
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1;
    }
    .site-header h1 span { color: var(--red); }
    .site-header .subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 10px;
      letter-spacing: 0.06em;
    }

    .main {
      max-width: 780px;
      margin: 0 auto;
      padding: 42px 16px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .protest-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: fadeInDown 0.8s ease-out;
    }

    .protest-card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      color: var(--red);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .protest-card p {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 15px;
      font-weight: 500;
    }

    .highlight-credit {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: var(--gold);
      letter-spacing: 0.08em;
      display: inline-block;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .tombstone-wrapper {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: floatTomb 3s ease-in-out infinite;
    }

    .tombstone {
      background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
      width: 240px;
      height: 340px;
      border-top-left-radius: 120px;
      border-top-right-radius: 120px;
      border: 4px solid #34495e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.5);
      position: relative;
    }

    .cross {
      font-size: 45px;
      color: #95a5a6;
      margin-bottom: 10px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .rip {
      font-family: "Times New Roman", serif;
      font-size: 32px;
      font-weight: bold;
      color: #ecf0f1;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .tombstone-text {
      font-size: 16px;
      color: #bdc3c7;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .base {
      background: linear-gradient(90deg, #1f2c38, #34495e, #1f2c38);
      width: 300px;
      height: 45px;
      border-top: 5px solid #2c3e50;
      border-radius: 4px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); text-shadow: 0 0 10px rgba(245,197,24,0.2); }
      50% { transform: scale(1.05); text-shadow: 0 0 20px rgba(245,197,24,0.6); }
    }

    @keyframes floatTomb {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="eyebrow">Tiltakozás</div>
    <h1>CREACODEX <span>IS CRAP</span></h1>
    <div class="subtitle">Diákmunka kontra Mesterséges Intelligencia</div>
  </header>

  <main class="main">
    <div class="protest-card">
      <h2>A Creacodex egy szar!</h2>
      <p>Mi a diákmunkát támogatjuk, nem az MI-t.</p>
      <div class="highlight-credit">Éljen a creacredit!</div>
    </div>

    <div class="tombstone-wrapper">
      <div class="tombstone">
        <div class="cross">†</div>
        <div class="rip">R.I.P.</div>
        <div class="tombstone-text">CREACREDIT</div>
      </div>
      <div class="base"></div>
    </div>
  </main>

</body>
</html>
