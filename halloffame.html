<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Creacredit | Dicsőségcsarnok</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#050c18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #050c18;
      --surface:  #0a1628;
      --card:     #0f1e36;
      --border:   rgba(255,255,255,0.06);
      --gold:     #f5c518;
      --gold-dim: rgba(245,197,24,0.08);
      --text:     #dce8f5;
      --muted:    #3d5270;
      --green:    #10d97c;
      --red:      #f74040;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Őrült, animált lenyíló menü sáv */
    .nav-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 100;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropbtn {
      background: linear-gradient(135deg, var(--card), var(--surface));
      color: var(--gold);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      padding: 10px 28px;
      border: 2px solid var(--gold);
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 15px rgba(245, 197, 24, 0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .dropbtn:hover {
      transform: scale(1.08) rotate(-1deg);
      box-shadow: 0 0 25px rgba(245, 197, 24, 0.5);
      background: var(--gold);
      color: var(--bg);
    }
    .dropbtn .arrow {
      transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    .dropdown.active .dropbtn .arrow {
      transform: rotate(225deg) scale(1.2);
    }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 130%;
      left: 50%;
      transform: translateX(-50%) scale(0.7) translateY(-20px);
      background: var(--card);
      min-width: 200px;
      border: 2px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      overflow: hidden;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 1;
    }
    .dropdown.active .dropdown-content {
      display: block;
      opacity: 1;
      transform: translateX(-50%) scale(1) translateY(0);
    }
    .dropdown-content a {
      color: var(--text);
      padding: 14px 20px;
      text-decoration: none;
      display: block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      transition: all 0.3s ease;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .dropdown-content a:last-child { border-bottom: none; }
    .dropdown-content a:hover {
      background: var(--gold);
      color: var(--bg);
      padding-left: 26px;
      letter-spacing: 0.15em;
    }

    .site-header {
      background: linear-gradient(180deg, #09162b 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      padding: 38px 24px 34px;
      text-align: center;
    }
    .site-header .eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .site-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.6rem, 8vw, 5rem);
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1;
    }
    .site-header h1 span { color: var(--gold); }

    .main {
      max-width: 800px;
      margin: 0 auto;
      padding: 42px 16px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* Őrült Dicsőségcsarnok doboz */
    .fame-card {
      background: var(--card);
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(245,197,24,0.05);
      animation: fadeInDown 0.8s ease-out;
    }
    .fame-card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: var(--gold);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(245,197,24,0.4);
    }
    .fame-card p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 30px;
      letter-spacing: 0.05em;
    }

    .signer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      max-height: 450px;
      overflow-y: auto;
      padding: 10px;
    }
    .signer-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-weight: 600;
      color: var(--text);
      font-size: 1.05rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      animation: popIn 0.5s ease-out backwards;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .signer-badge:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: var(--gold);
      box-shadow: 0 8px 25px rgba(245,197,24,0.2);
      color: var(--gold);
    }
    .signer-badge::before {
      content: '🕯️';
      font-size: 1rem;
    }

    .empty-msg {
      grid-column: 1 / -1;
      color: var(--muted);
      font-style: italic;
      padding: 20px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- Középre igazított őrült menü sáv -->
  <nav class="nav-bar">
    <div class="dropdown" id="nav-dropdown">
      <button class="dropbtn" id="dropbtn">Menü <span class="arrow">✦</span></button>
      <div class="dropdown-content">
        <a href="index.html">Főoldal</a>
        <a href="halloffame.html">Hall of Fame</a>
        <a href="insta.html">Instagram</a>
      </div>
    </div>
  </nav>

  <header class="site-header">
    <div class="eyebrow">Örök Emlék</div>
    <h1>DICSŐSÉG<span>CSARNOK</span></h1>
  </header>

  <main class="main">
    <div class="fame-card">
      <h2>Akik kiálltak a Creacreditért</h2>
      <p>Íme azoknak a listája, akik hozzájárultak a nevük nyilvános megjelenítéséhez.</p>
      
      <div class="signer-grid" id="signer-grid">
        <div class="signer-badge empty-msg">Adatok betöltése a dicsőségcsarnokba...</div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCl7wsIHzdHcmnJSMZZCieacZROxlJnxvI",
      authDomain: "creacredit-szuper1212856.firebaseapp.com",
      projectId: "creacredit-szuper1212856",
      storageBucket: "creacredit-szuper1212856.firebasestorage.app",
      messagingSenderId: "480853534754",
      appId: "1:480853534754:web:c118bec98985668a59427b",
      measurementId: "G-05N82W8N9N"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    const signerGrid = document.getElementById('signer-grid');

    // Őrült animált lenyíló menü eseménykezelő
    const navDropdown = document.getElementById('nav-dropdown');
    const dropBtn = document.getElementById('dropbtn');
    
    dropBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      navDropdown.classList.toggle('active');
    });
    window.addEventListener('click', () => {
      navDropdown.classList.remove('active');
    });

    async function loadHallOfFame() {
      try {
        const querySnapshot = await getDocs(collection(db, "signatures"));
        signerGrid.innerHTML = '';
        
        let count = 0;
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          
          // Kizárólag akkor listázzuk, ha a consent értéke szigorúan true
          if (data.consent === true) {
            count++;
            const badge = document.createElement('div');
            badge.className = 'signer-badge';
            badge.style.animationDelay = `${count * 0.05}s`;
            badge.textContent = data.name;
            signerGrid.appendChild(badge);
          }
        });

        if (count === 0) {
          signerGrid.innerHTML = '<div class="signer-badge empty-msg">Még senki sem engedélyezte a nevének nyilvános megjelenítését.</div>';
        }

      } catch (e) {
        console.error("Hiba a betöltés során: ", e);
        signerGrid.innerHTML = '<div class="signer-badge empty-msg">Hiba történt az adatok betöltése közben.</div>';
      }
    }

    loadHallOfFame();
  </script>

</body>
  </html>
